# Better as a native iPhone app, built and run in the iOS simulator.
#
# The L8 compiler is an x86-64 Linux program, so a Linux job builds it and
# compiles programs/better/ios.l8 to arm64 assembly (`l8 arm64 --target
# ios`); a macOS job assembles and links that with Xcode's tools into
# Better.app (tools/ios/build.sh) and runs it in the simulator, recording a
# run by itself (tools/ios/simulate.sh). What the simulator showed is kept as
# the run's artifacts, and pushed to the ci-shots branch (one commit, each
# run replacing the last) to be fetched without the API. Another macOS job
# builds Better.ipa, the app for an iPhone, onto the ci-ipa branch (ad hoc
# signed; tools/ios/sign.sh signs it for a phone or for TestFlight, and
# tools/ios/apple.py uploads it, from Linux).
name: iOS

on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler
        run: make -j4 l8c3
      - name: Compile Better, and the runtime's check, for iOS
        run: |
          ./l8c3 arm64 --target ios programs/better/ios.l8 -o better-ios.s
          ./l8c3 arm64 --target ios programs/ios/check.l8 -o check-ios.s
      - uses: actions/upload-artifact@v4
        with:
          name: better-ios-assembly
          path: |
            better-ios.s
            check-ios.s

  # The app for an iPhone, ad hoc signed (sign.sh signs it for a phone or
  # for TestFlight), on the ci-ipa branch soon after a push: apart from the
  # simulator, which takes minutes.
  device:
    needs: compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: better-ios-assembly
      - name: Build Better for an iPhone
        run: |
          # (With the newest Xcode there: App Store Connect wants a recent SDK.)
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          tools/ios/build.sh device better-ios.s device
          mkdir -p ipa/Payload && cp -R device/Better.app ipa/Payload/
          (cd ipa && zip -qry ../Better.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: better-ipa
          path: Better.ipa
      - name: Push it to ci-ipa
        run: |
          mkdir -p publish && cp Better.ipa publish/
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-ipa
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "iPhone build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-ipa

  simulator:
    needs: compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: better-ios-assembly
      - name: Build Better.app
        run: tools/ios/build.sh sim better-ios.s build 2>&1 | tee build.log
      - name: Build the runtime's check
        run: |
          xcrun --sdk iphonesimulator clang -target arm64-apple-ios16.0-simulator -c -x assembler check-ios.s -o check.o
          xcrun --sdk iphonesimulator clang -target arm64-apple-ios16.0-simulator check.o -o check -framework Foundation -lobjc
      - name: Run it in the simulator
        run: tools/ios/simulate.sh build/Better.app shots "$PWD/check"
      - name: Keep the app (for Appetize or another Mac's simulator)
        if: always()
        run: cd build && zip -qry ../Better-simulator.zip Better.app || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: better-simulator
          path: |
            shots
            build.log
            Better-simulator.zip
      - name: Push the screenshots to ci-shots
        if: always()
        run: |
          mkdir -p publish
          cp -r shots/. publish/ 2>/dev/null || true
          cp build.log Better-simulator.zip publish/ 2>/dev/null || true
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-shots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Simulator run ${GITHUB_RUN_ID} of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
