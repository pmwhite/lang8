# Build Better iPhone and simulator app artifacts without UI test runs.
name: iOS

on:
  push:
    branches: [trunk]
    # (Only what the app is built from: Better, the libraries and tools it
    # uses, and the compiler; the rest of trunk's programs do not start a
    # run.)
    paths:
      - 'programs/better/**'
      - '!programs/better/*.md'
      - 'programs/ios/**'
      - 'programs/gl/**'
      - 'programs/skate/font.l8'
      - 'programs/skate/math.l8'
      - 'src1/**'
      - 'src2/**'
      - 'bootstrap'
      - 'runtime*.s'
      - 'stdlib/**'
      - 'tools/ios/**'
      - 'Makefile'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler
        run: make -j4 l8c3
      - name: Compile Better for iOS
        run: |
          ./l8c3 arm64 --target ios programs/better/ios.l8 -o better-ios.s
      - uses: actions/upload-artifact@v4
        with:
          name: better-ios-assembly
          path: |
            better-ios.s

  # The app for an iPhone, ad hoc signed (sign.sh signs it for a phone or
  # for TestFlight), on the ci-ipa branch soon after a push: apart from the
  # simulator, which takes minutes.
  device:
    needs: compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: better-ios-assembly
      - name: Build Better for an iPhone
        run: |
          # (With the newest Xcode there: App Store Connect wants a recent SDK.)
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          tools/ios/build.sh device better-ios.s device
          mkdir -p ipa/Payload && cp -R device/Better.app ipa/Payload/
          (cd ipa && zip -qry ../Better.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: better-ipa
          path: Better.ipa
      - name: Push it to ci-ipa
        run: |
          mkdir -p publish && cp Better.ipa publish/
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-ipa
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "iPhone build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-ipa

  simulator:
    needs: compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: better-ios-assembly
      - name: Build Better.app
        run: tools/ios/build.sh sim better-ios.s build 2>&1 | tee build.log
      - name: Keep the simulator app
        run: cd build && zip -qry ../Better-simulator.zip Better.app
      - uses: actions/upload-artifact@v4
        with:
          name: better-simulator
          path: |
            build.log
            Better-simulator.zip
