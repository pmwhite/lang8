# Smooth Bible's (and Tempo's) asset catalogs, compiled on a Mac whenever
# the icons or named colors change, so the apps can be built without one
# (tools/ios/build-linux.sh). tools/ios/assets.sh compiles each, for
# iphoneos and iphonesimulator, with the newest Xcode on the runner, and
# the results are pushed to the ci-bible-assets branch, laid out as in the
# repository; bring them in with
#   git fetch origin ci-bible-assets
#   git checkout origin/ci-bible-assets -- programs/bible/ios/assets tools/ios/assets
# (tools/ios/assets.py check DIR says whether DIR/assets is up to date.)
name: Smooth Bible assets

on:
  push:
    branches: [bible]
    paths:
      - 'programs/bible/ios/AppIcon*.png'
      - 'programs/bible/ios/Colors/**'
      - 'tools/ios/AppIcon*.png'
      - 'tools/ios/Colors/**'
      - 'tools/ios/assets.sh'
      - 'tools/ios/assets.py'
      - '.github/workflows/bible-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bible-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile the asset catalogs
        run: |
          export DEVELOPER_DIR="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          tools/ios/assets.sh programs/bible/ios publish/programs/bible/ios/assets
          tools/ios/assets.sh tools/ios publish/tools/ios/assets
          for sdk in iphoneos iphonesimulator; do
            cmp publish/programs/bible/ios/assets/iphoneos/Assets.car publish/programs/bible/ios/assets/$sdk/Assets.car \
              && echo "Assets.car: $sdk's is iphoneos's" || echo "Assets.car: $sdk's differs from iphoneos's"
          done
      - name: Push them to ci-bible-assets
        run: |
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-bible-assets
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Asset catalogs of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-bible-assets
