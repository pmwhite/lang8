# Smooth Bible (programs/bible), built and run in the iOS simulator.
#
# A Linux job builds the compiler and compiles programs/bible/ios.l8 to
# arm64 assembly (`l8 arm64 --target ios`). macOS jobs assemble and link it
# with Xcode's tools into SmoothBible.app (tools/ios/build.sh, with
# programs/bible/ios): six run it in simulators side by side, each a group
# of the demo (programs/bible/ios/simulate.sh: read, study, notes, which
# also records the screen; more, Round 3's; store, the App Store's
# screenshots on the largest iPhone; ios18, a few shots on an iOS 18
# runtime, if there is one); another builds SmoothBible.ipa, for an iPhone,
# onto the ci-bible-ipa branch (ad hoc signed). (Launches were timed against
# Round 1's app with programs/bible/ios/launch.sh in a job of their own, for
# review r2-1.) A last Linux job puts the groups' screenshots
# together (programs/bible/ios/shots.py: the collapsing bar's pixel check,
# the recording's frames and contact sheet) and pushes them to the
# ci-bible-shots branch (one commit, each run replacing the last).
name: Smooth Bible

on:
  push:
    branches: [bible]
  workflow_dispatch:

permissions:
  contents: write

# (A newer push stops the run before it.)
concurrency:
  group: bible
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler
        run: make -j4 l8c3
      - name: Test the text's layout
        run: ./l8c3 test programs/bible/test_text.l8 programs/bible/test_lang.l8 programs/bible/test_store.l8 programs/bible/test_plans.l8 programs/bible/test_readings.l8
      - name: Check the data (senses, related words)
        run: for t in senses related; do python3 -I programs/bible/tools/$t.py --check programs/bible/data; done
      - name: Test the ESV proxy (against fixtures, no key)
        run: node --test programs/bible/worker/test.mjs
      - name: Compile the app for iOS
        run: ./l8c3 arm64 --target ios programs/bible/ios.l8 -o bible-ios.s
      - uses: actions/upload-artifact@v4
        with:
          name: bible-ios-assembly
          path: bible-ios.s

  device:
    needs: compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bible-ios-assembly
      - name: Build the app for an iPhone
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
          tools/ios/build.sh device bible-ios.s device programs/bible/ios
          mkdir -p ipa/Payload && cp -R device/SmoothBible.app ipa/Payload/
          (cd ipa && zip -qry ../SmoothBible.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: bible-ipa
          path: SmoothBible.ipa
      - name: Push it to ci-bible-ipa
        run: |
          mkdir -p publish && cp SmoothBible.ipa publish/
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-bible-ipa
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "iPhone build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-bible-ipa

  simulator:
    needs: compile
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [read, study, notes, more, store, ios18, versions, plans, reading]
    steps:
      - uses: actions/checkout@v4
      - name: Boot a simulator (while the app is built)
        run: |
          xcrun simctl list runtimes
          dev=$(programs/bible/ios/pick.sh ${{ matrix.group }})
          echo "simulator for ${{ matrix.group }}: $dev"
          [ -n "$dev" ] && (xcrun simctl boot "$dev" &) || true
      - uses: actions/download-artifact@v4
        with:
          name: bible-ios-assembly
      - name: Build SmoothBible.app
        run: BUILD_NUMBER=${{ github.run_number }} tools/ios/build.sh sim bible-ios.s build programs/bible/ios 2>&1 | tee build.log
      - name: Run its demo's ${{ matrix.group }} group in the simulator
        run: programs/bible/ios/simulate.sh build/SmoothBible.app shots ${{ matrix.group }}
      - name: Keep the app (for another Mac's simulator)
        if: always() && matrix.group == 'read'
        run: cd build && zip -qry ../SmoothBible-simulator.zip SmoothBible.app || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.group }}
          path: |
            shots
            build.log
            SmoothBible-simulator.zip

  publish:
    needs: simulator
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: groups
      - name: Put the groups together
        run: |
          mkdir -p publish
          for g in read study notes more store ios18 versions plans reading; do
            s=groups/shots-$g/shots
            [ -d "$s" ] || continue
            cp "$s"/*.png publish/ 2>/dev/null || true
            for f in "$s"/*; do
              case "$f" in *.png) ;; *) cp -r "$f" "publish/$g-$(basename "$f")" ;; esac
            done
            cp groups/shots-$g/build.log publish/$g-build.log 2>/dev/null || true
          done
          mv publish/notes-transitions.mp4 publish/transitions.mp4 2>/dev/null || true
          mv publish/more-notes-export.md publish/notes-export.md 2>/dev/null || true
          cat publish/store-plain-launch.txt publish/ios18-ios18.txt 2>/dev/null || true
          mv publish/notes-transitions.txt publish/transitions.txt 2>/dev/null || true
      - name: The collapsing bar's pixel check, and the recording's frames
        run: |
          python3 -m venv venv
          venv/bin/pip install --quiet pillow av
          venv/bin/python programs/bible/ios/shots.py publish | tee -a publish/read-log.txt
      - name: Push the screenshots to ci-bible-shots
        run: |
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-bible-shots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Simulator run ${GITHUB_RUN_ID} of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-bible-shots
