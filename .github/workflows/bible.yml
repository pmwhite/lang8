# Smooth Bible (programs/bible), built and run in the iOS simulator.
#
# compile (Linux) builds the compiler (kept in a cache while its sources
# are unchanged) and the app with it, no Mac needed: SmoothBible.app for the
# simulator, uploaded for all five simulator jobs, then SmoothBible.ipa,
# for an iPhone, onto the ci-bible-ipa branch (tools/ios/build-linux.sh:
# the compiler assembles and links the executable itself, `l8 arm64 --exe`;
# the asset catalog is the one kept compiled in programs/bible/ios/assets;
# the bundle is signed ad hoc with rcodesign). test, beside it, runs the
# tests and data checks. Five simulator jobs (macOS) start at once, boot
# their first simulator (a first boot takes about three minutes) and fetch
# the app as soon as it is uploaded (tools/ios/artifact.py). With MAC_BUILD
# set (below), the first simulator job builds the app and the IPA instead,
# from compile's assembly, with Xcode's tools (tools/ios/build.sh; actool's
# output cached), as before the Linux build. Each runs two groups of the
# demo (two run three) one after another (programs/bible/ios/simulate.sh),
# the second on the first's simulator, reset (a boot, with what the
# simulator does after it, takes minutes); but store (the largest iPhone),
# memory (after store, on an iPhone 16 of its own) and ios18 (third, after
# ribbons and study, on an iOS 18 runtime) have simulators of their own.
# Each group's shots are uploaded as it ends (shots-GROUP). The groups are paired
# so the five jobs end together: GitHub runs at most five macOS jobs of this
# account at a time, and a sixth would wait for one of them to end.
# frames (Linux) waits for the notes group's
# recording and makes its frames and contact sheet while the others run
# (programs/bible/ios/shots.py transitions). A last Linux job, publish, puts
# the groups' screenshots together (and the collapsing bar's pixel check)
# and pushes them to the ci-bible-shots branch (one commit, each run
# replacing the last). The groups: read, study, notes (which also records
# the screen), more (Round 3's), store (the App Store's screenshots on the
# largest iPhone), ios18 (a few shots on an iOS 18 runtime, if there is
# one), versions, plans, ribbons, listen, memory, languages (Round 10's,
# about 3 minutes: first on the versions job's iPhone, more third on it),
# help (§15's, about 3 minutes: third on the notes job's iPhone), plans
# (with §16's day's reader: second on the read job's iPhone, last since it
# leaves its alert), ipad (§17's, on the 13-inch iPad Pro: fourth on the
# notes job, its iPad booted when its turn comes: run 39536990908 booted it
# while help ran, which took help from 2.5 minutes to 10.6, and 39541699431
# beside notes' iPhone, which took notes from 6.5 to 12.4 and listen from 4
# to 6.3).
# (Launches were timed
# against Round 1's app with programs/bible/ios/launch.sh in a job of their
# own, for review r2-1.)
#
# A push that changes only documentation or the website (programs/bible's
# *.md and site/, which no build, test or demo step reads) does not run: a
# builder waiting for RUN.txt (ci-bible-shots, ci-bible-ipa) to name such a
# sha should wait for the last sha that changed code instead.
name: Smooth Bible

on:
  push:
    branches: [bible]
    # (Documentation or the website only: no run. Any other file, and it runs.)
    paths-ignore:
      - 'programs/bible/*.md'
      - 'programs/bible/site/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# (A push while a run is going waits for it, rather than stopping it, so a
# run always finishes and publishes; of the pushes made meanwhile only the
# newest then runs.)
concurrency:
  group: bible
  cancel-in-progress: false

env:
  # 'true': the app built on the first Mac with Xcode's tools (build.sh),
  # as before; otherwise on Linux, in compile (build-linux.sh).
  MAC_BUILD: 'false'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: compiler
        with:
          path: l8c3
          key: l8c3-${{ hashFiles('bootstrap', 'Makefile', 'tools/step.sh', 'runtime*.s', 'src1/**', 'src2/**', 'stdlib/**') }}
      - name: Build the compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        run: make -j4 l8c3
      - name: Compile the app for iOS
        run: ./l8c3 arm64 --target ios programs/bible/ios.l8 -o bible-ios.s
      - uses: actions/upload-artifact@v4
        with:
          name: bible-ios-assembly
          path: bible-ios.s
      - name: rcodesign (to sign the app ad hoc)
        if: env.MAC_BUILD != 'true'
        run: |
          v=0.29.0
          f=apple-codesign-$v-x86_64-unknown-linux-musl
          curl -sSfL -o rcodesign.tgz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/$f.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  rcodesign.tgz" | sha256sum -c -
          tar xzf rcodesign.tgz && mv $f/rcodesign . && rm -rf $f rcodesign.tgz
      - name: Build SmoothBible.app (for every simulator job)
        if: env.MAC_BUILD != 'true'
        run: |
          # (Linked with iOS 26.2's SDK, as the iPhone build is: iOS 26's
          # design, on the iOS 26.2 simulators pick.sh chooses.)
          RCODESIGN=$PWD/rcodesign BUILD_NUMBER=${{ github.run_number }} tools/ios/build-linux.sh sim programs/bible/ios.l8 build programs/bible/ios 2>&1 | tee build.log
          mkdir -p app && cp build.log app/ && (cd build && zip -qry ../app/SmoothBible-simulator.zip SmoothBible.app)
      - uses: actions/upload-artifact@v4
        if: env.MAC_BUILD != 'true'
        with:
          name: bible-sim-app
          path: app
      - name: Build the app for an iPhone, and push it to ci-bible-ipa
        if: env.MAC_BUILD != 'true'
        run: |
          RCODESIGN=$PWD/rcodesign tools/ios/build-linux.sh device programs/bible/ios.l8 device programs/bible/ios
          mkdir -p publish && cp device/SmoothBible.ipa SmoothBible.ipa && cp SmoothBible.ipa publish/
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-bible-ipa
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "iPhone build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-bible-ipa
      - uses: actions/upload-artifact@v4
        if: env.MAC_BUILD != 'true'
        with:
          name: bible-ipa
          path: SmoothBible.ipa

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: compiler
        with:
          path: l8c3
          key: l8c3-${{ hashFiles('bootstrap', 'Makefile', 'tools/step.sh', 'runtime*.s', 'src1/**', 'src2/**', 'stdlib/**') }}
      - name: Build the compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        run: make -j4 l8c3
      - name: Test the text's layout
        run: ./l8c3 test programs/bible/test_text.l8 programs/bible/test_lang.l8 programs/bible/test_store.l8 programs/bible/test_plans.l8 programs/bible/test_ribbons.l8 programs/bible/test_audio.l8 programs/bible/test_memory.l8 programs/bible/test_learn.l8 programs/bible/test_help.l8 programs/bible/test_html.l8
      - name: Check the data (senses, related words, eBible.org's audio paths, the Chronological plan)
        run: |
          for t in senses related learn; do python3 -I programs/bible/tools/$t.py --check programs/bible/data; done
          python3 -I programs/bible/tools/web_audio_manifest.py --check programs/bible/data
          python3 -I programs/bible/tools/chrono.py --check programs/bible/data
      - name: Build the spoken text's tool (for the aligner)
        run: ./l8c3 build programs/bible/tools/spoken.l8 -o bible-spoken && ./bible-spoken programs/bible/data/bsb.txt | head -3
      - name: Test the ESV proxy (against fixtures, no key)
        run: node --test programs/bible/worker/test.mjs
      - name: Check the compiler's arm64 encoding against LLVM's (llvm-mc)
        run: |
          bin=$(dirname "$(ls /usr/lib/llvm-*/bin/llvm-mc | sort -V | tail -1)")
          LLVM_BIN=$bin python3 -I tools/arm64/check.py ios programs/bible/ios.l8
          LLVM_BIN=$bin python3 -I tools/arm64/check.py fuzz 20000 1

  simulator:
    name: simulator (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # (Paired by the groups' times, so the jobs end together, each
        # about 13 or 14 minutes; programs/bible/README.md. Run
        # 39427732615's: store 5 minutes with its boot, memory 8 on a
        # simulator of its own (4 of them its boot), ios18 4 (3 its boot),
        # notes and listen 14, read and plans 13.5, versions and more 12.5,
        # ribbons and study 10.5. own2: the second group on an iPhone of its
        # own, not the first's: memory's an iPhone 16 like every group's but
        # store's largest one. A third group, ios18, on its own iOS 18
        # iPhone; help (§15, about 3 minutes) third after notes and listen,
        # on their iPhone, since plans grew by §16's day's reader (about 4
        # minutes more: run 39506634363's groups, read 7.2, help 2.5, plans
        # 2.9, notes 6, listen 3.8). A group that leaves something behind outside the app,
        # plans' alert or more's share sheet, goes last. With MAC_BUILD the
        # first job builds the app for all five, and the IPA.)
        include:
          - {name: build store memory, build: true, g1: store, g2: memory, own2: true}
          - {name: notes listen help ipad, g1: notes, g2: listen, g3: help, g4: ipad}
          - {name: languages versions more, g1: languages, g2: versions, g3: more}
          - {name: read plans, g1: read, g2: plans}
          - {name: ribbons study ios18, g1: ribbons, g2: study, g3: ios18}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Boot the first group's simulator (a boot takes minutes)
        run: |
          mkdir -p devices
          programs/bible/ios/pick.sh ${{ matrix.g1 }} > devices/${{ matrix.g1 }}
          dev=$(cat devices/${{ matrix.g1 }})
          echo "simulator for ${{ matrix.g1 }}: $dev"
          # (The second group on the first's simulator, reset, unless own2:
          # store's is the largest iPhone, and memory's an iPhone 16.)
          if [ "${{ matrix.own2 }}" = true ]; then
            programs/bible/ios/pick.sh ${{ matrix.g2 }} > devices/${{ matrix.g2 }}
          else
            cp devices/${{ matrix.g1 }} devices/${{ matrix.g2 }}
          fi
          # (A third group, if any, after the second, on an iPhone of its own:
          # ios18's an older runtime.)
          [ -n "${{ matrix.g3 }}" ] && programs/bible/ios/pick.sh ${{ matrix.g3 }} > devices/${{ matrix.g3 }} || true
          # (A fourth, ipad, on a 13-inch iPad of its own, booted when its
          # turn comes: booted beside the others, it slowed them more than its
          # boot costs alone; runs 39536990908 and 39541699431.)
          [ -n "${{ matrix.g4 }}" ] && programs/bible/ios/pick.sh ${{ matrix.g4 }} > devices/${{ matrix.g4 }} || true
          [ -n "$dev" ] && (xcrun simctl boot "$dev" >/dev/null 2>&1 &) || true
      - uses: actions/cache@v4
        if: matrix.build && env.MAC_BUILD == 'true'
        with:
          path: actool-cache
          key: actool-${{ hashFiles('programs/bible/ios/AppIcon*.png', 'programs/bible/ios/Colors/**') }}-${{ github.run_id }}
          restore-keys: |
            actool-${{ hashFiles('programs/bible/ios/AppIcon*.png', 'programs/bible/ios/Colors/**') }}-
      - name: Wait for the assembly
        if: matrix.build && env.MAC_BUILD == 'true'
        run: python3 -I tools/ios/artifact.py bible-ios-assembly . compile
      - name: Build SmoothBible.app (for every job's simulator)
        if: matrix.build && env.MAC_BUILD == 'true'
        run: |
          ACTOOL_CACHE=$PWD/actool-cache BUILD_NUMBER=${{ github.run_number }} tools/ios/build.sh sim bible-ios.s build programs/bible/ios 2>&1 | tee build.log
          mkdir -p app && cp build.log app/ && (cd build && zip -qry ../app/SmoothBible-simulator.zip SmoothBible.app)
      - uses: actions/upload-artifact@v4
        if: matrix.build && env.MAC_BUILD == 'true'
        with:
          name: bible-sim-app
          path: app
      - name: Build the app for an iPhone, and push it to ci-bible-ipa
        if: matrix.build && env.MAC_BUILD == 'true'
        run: |
          export DEVELOPER_DIR="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          ACTOOL_CACHE=$PWD/actool-cache tools/ios/build.sh device bible-ios.s device programs/bible/ios
          mkdir -p ipa/Payload && cp -R device/SmoothBible.app ipa/Payload/
          (cd ipa && zip -qry ../SmoothBible.ipa Payload)
          mkdir -p publish && cp SmoothBible.ipa publish/
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-bible-ipa
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "iPhone build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-bible-ipa
      - uses: actions/upload-artifact@v4
        if: matrix.build && env.MAC_BUILD == 'true'
        with:
          name: bible-ipa
          path: SmoothBible.ipa
      - name: Wait for SmoothBible.app (from compile, or the first job)
        if: ${{ !matrix.build || env.MAC_BUILD != 'true' }}
        run: |
          python3 -I tools/ios/artifact.py bible-sim-app app "${{ env.MAC_BUILD == 'true' && 'simulator (build' || 'compile' }}"
          mkdir -p build && (cd build && unzip -q ../app/SmoothBible-simulator.zip) && cp app/build.log .
      - name: The app is here
        id: build
        run: test -d build/SmoothBible.app
      - name: Run its demo's ${{ matrix.g1 }} group in the simulator
        if: always() && steps.build.outcome == 'success'
        run: |
          SIM_DEVICE=$(cat devices/${{ matrix.g1 }} 2>/dev/null) programs/bible/ios/simulate.sh build/SmoothBible.app out/${{ matrix.g1 }}/shots ${{ matrix.g1 }}
      - name: Keep the ${{ matrix.g1 }} group's build log (and read's app, for another Mac's simulator)
        if: always()
        run: |
          mkdir -p out/${{ matrix.g1 }}/shots && cp build.log out/${{ matrix.g1 }}/ 2>/dev/null || true
          [ "${{ matrix.g1 }}" = read ] && cp app/SmoothBible-simulator.zip out/read/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.g1 }}
          path: out/${{ matrix.g1 }}
      - name: Run its demo's ${{ matrix.g2 }} group in the simulator
        if: always() && steps.build.outcome == 'success'
        run: |
          SIM_DEVICE=$(cat devices/${{ matrix.g2 }} 2>/dev/null) programs/bible/ios/simulate.sh build/SmoothBible.app out/${{ matrix.g2 }}/shots ${{ matrix.g2 }}
      - name: Keep the ${{ matrix.g2 }} group's build log (and read's app, for another Mac's simulator)
        if: always()
        run: |
          mkdir -p out/${{ matrix.g2 }}/shots && cp build.log out/${{ matrix.g2 }}/ 2>/dev/null || true
          [ "${{ matrix.g2 }}" = read ] && cp app/SmoothBible-simulator.zip out/read/ 2>/dev/null || true
          # (Shut down, unless the third group runs on it next: languages'.)
          dev=$(cat devices/${{ matrix.g2 }} 2>/dev/null) && [ -n "$dev" ] && [ "$dev" != "$(cat devices/${{ matrix.g3 }} 2>/dev/null)" ] && xcrun simctl shutdown "$dev" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.g2 }}
          path: out/${{ matrix.g2 }}
      - name: Run its demo's ${{ matrix.g3 }} group in the simulator
        if: always() && steps.build.outcome == 'success' && matrix.g3 != ''
        run: |
          SIM_DEVICE=$(cat devices/${{ matrix.g3 }} 2>/dev/null) programs/bible/ios/simulate.sh build/SmoothBible.app out/${{ matrix.g3 }}/shots ${{ matrix.g3 }}
      - name: Keep the ${{ matrix.g3 }} group's build log
        if: always() && matrix.g3 != ''
        run: |
          mkdir -p out/${{ matrix.g3 }}/shots && cp build.log out/${{ matrix.g3 }}/ 2>/dev/null || true
          dev=$(cat devices/${{ matrix.g3 }} 2>/dev/null) && [ -n "$dev" ] && xcrun simctl shutdown "$dev" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && matrix.g3 != ''
        with:
          name: shots-${{ matrix.g3 }}
          path: out/${{ matrix.g3 }}
      - name: Run its demo's ${{ matrix.g4 }} group in the simulator
        if: always() && steps.build.outcome == 'success' && matrix.g4 != ''
        run: |
          SIM_DEVICE=$(cat devices/${{ matrix.g4 }} 2>/dev/null) programs/bible/ios/simulate.sh build/SmoothBible.app out/${{ matrix.g4 }}/shots ${{ matrix.g4 }}
      - name: Keep the ${{ matrix.g4 }} group's build log
        if: always() && matrix.g4 != ''
        run: |
          mkdir -p out/${{ matrix.g4 }}/shots && cp build.log out/${{ matrix.g4 }}/ 2>/dev/null || true
          dev=$(cat devices/${{ matrix.g4 }} 2>/dev/null) && [ -n "$dev" ] && xcrun simctl shutdown "$dev" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && matrix.g4 != ''
        with:
          name: shots-${{ matrix.g4 }}
          path: out/${{ matrix.g4 }}

  frames:
    # The notes group's recording, made into frames while the other groups
    # still run. (Never keeping the shots from being published.)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Pillow and PyAV
        # (Wheels only, so a runner without them fails fast rather than compiling.)
        run: |
          python3 -m venv venv
          timeout 300 venv/bin/pip install --quiet --only-binary=:all: pillow av || echo "frames: no wheels"
      - name: Wait for the notes group
        run: python3 -I tools/ios/artifact.py shots-notes notes simulator
      - name: The recording's frames
        run: |
          mkdir -p frames
          cp notes/shots/transitions.mp4 notes/shots/transitions.txt frames/ 2>/dev/null || true
          timeout 600 venv/bin/python programs/bible/ios/shots.py frames transitions | tee frames.txt || true
          rm -f frames/transitions.mp4 frames/transitions.txt
          mv frames.txt frames/frames.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frames
          path: frames

  publish:
    needs: [simulator, frames]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: groups
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frames
          path: frames
      - name: Put the groups together
        run: |
          mkdir -p publish
          for g in read study notes more store ios18 versions plans ribbons listen memory languages help ipad; do
            s=groups/shots-$g/shots
            [ -d "$s" ] || continue
            cp "$s"/*.png publish/ 2>/dev/null || true
            for f in "$s"/*; do
              case "$f" in *.png) ;; *) cp -r "$f" "publish/$g-$(basename "$f")" ;; esac
            done
            cp groups/shots-$g/build.log publish/$g-build.log 2>/dev/null || true
          done
          mv publish/notes-transitions.mp4 publish/transitions.mp4 2>/dev/null || true
          mv publish/more-notes-export.md publish/notes-export.md 2>/dev/null || true
          cat publish/store-plain-launch.txt publish/ios18-ios18.txt 2>/dev/null || true
          mv publish/notes-transitions.txt publish/transitions.txt 2>/dev/null || true
      - name: The collapsing bar's pixel check, and the recording's frames (from frames)
        # (Never keeping the shots from being published.)
        continue-on-error: true
        run: |
          python3 -m venv venv
          timeout 300 venv/bin/pip install --quiet --only-binary=:all: pillow || echo "pixel check: no wheels"
          timeout 300 venv/bin/python programs/bible/ios/shots.py publish collapse | tee -a publish/read-log.txt || true
          # (Shots taken with the interface turned, set upright: §17.8.2.)
          timeout 300 venv/bin/python programs/bible/ios/shots.py publish upright | tee -a publish/read-log.txt || true
          if [ -f frames/frames.txt ]; then
            cat frames/frames.txt | tee -a publish/read-log.txt
            rm frames/frames.txt
            cp -R frames/. publish/
          else
            echo "transitions failed: no frames from the frames job" | tee -a publish/read-log.txt
          fi
      - name: Push the screenshots to ci-bible-shots
        if: always()
        run: |
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-bible-shots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Simulator run ${GITHUB_RUN_ID} of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-bible-shots

  # The reader on the web (programs/bible/WEB.md §W14.5): the site built
  # (every chapter prerendered, the app as WebAssembly) and checked, the
  # tests again as WebAssembly, then the driver's flows and shots in the
  # runner's Chrome (web/bible/test/drive.mjs; about five minutes). The
  # shots go to ci-bible-web-shots (its own branch, so it never races
  # the iPhone's publish), with RUN.txt and the checks, whether or not
  # they all passed; then the job fails if any did not.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: compiler
        with:
          path: l8c3
          key: l8c3-${{ hashFiles('bootstrap', 'Makefile', 'tools/step.sh', 'runtime*.s', 'src1/**', 'src2/**', 'stdlib/**') }}
      - name: Build the compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        run: make -j4 l8c3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the site, and the tests as WebAssembly
        # (-o l8c3: the cached compiler is used as it is.)
        run: make -j4 -o l8c3 bible-web bible-wasm-test
      - name: The driver's flows and shots
        id: drive
        run: |
          (cd web/bible/test && npm ci --no-audit --no-fund)
          mkdir -p shots
          CHROME=$(command -v google-chrome) node web/bible/test/drive.mjs --out shots 2>&1 | tee shots/drive.log; echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Push the shots to ci-bible-web-shots
        if: always()
        run: |
          mkdir -p shots && cd shots
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > RUN.txt
          git init -q -b ci-bible-web-shots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Web shots of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-bible-web-shots
      - name: Every check passed
        run: test "${{ steps.drive.outputs.status }}" = 0
