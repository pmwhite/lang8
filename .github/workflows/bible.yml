# Build Smooth Bible iOS and web artifacts without test or screenshot jobs.
name: Smooth Bible

on:
  push:
    branches: [trunk]
    paths:
      - 'programs/bible/**'
      - '!programs/bible/*.md'
      - '!programs/bible/site/**'
      - 'programs/ios/**'
      - 'src1/**'
      - 'src2/**'
      - 'bootstrap'
      - 'runtime*.s'
      - 'stdlib/**'
      - 'tools/ios/**'
      - 'tools/arm64/**'
      - 'Makefile'
      - '.github/workflows/bible.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bible
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: compiler
        with:
          path: l8c3
          key: l8c3-${{ hashFiles('bootstrap', 'Makefile', 'tools/step.sh', 'runtime*.s', 'src1/**', 'src2/**', 'stdlib/**') }}
      - name: Build the compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        run: make -j4 l8c3
      - name: Compile the app for iOS
        run: ./l8c3 arm64 --target ios programs/bible/ios/app.l8 -o bible-ios.s
      - uses: actions/upload-artifact@v4
        with:
          name: bible-ios-assembly
          path: bible-ios.s
      - name: rcodesign (to sign the app ad hoc)
        run: |
          v=0.29.0
          f=apple-codesign-$v-x86_64-unknown-linux-musl
          curl -sSfL -o rcodesign.tgz "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/$f.tar.gz"
          echo "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002  rcodesign.tgz" | sha256sum -c -
          tar xzf rcodesign.tgz && mv $f/rcodesign . && rm -rf $f rcodesign.tgz
      - name: Build the simulator app artifact
        run: |
          # Linked with iOS 26.2's SDK, as the iPhone build is.
          RCODESIGN=$PWD/rcodesign BUILD_NUMBER=${{ github.run_number }} tools/ios/build-linux.sh sim programs/bible/ios/app.l8 build programs/bible/ios 2>&1 | tee build.log
          mkdir -p app && cp build.log app/ && (cd build && zip -qry ../app/SmoothBible-simulator.zip SmoothBible.app)
      - uses: actions/upload-artifact@v4
        with:
          name: bible-sim-app
          path: app
      - name: Build the app for an iPhone, and push it to ci-bible-ipa
        run: |
          RCODESIGN=$PWD/rcodesign tools/ios/build-linux.sh device programs/bible/ios/app.l8 device programs/bible/ios
          mkdir -p publish && cp device/SmoothBible.ipa SmoothBible.ipa && cp SmoothBible.ipa publish/
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-bible-ipa
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "iPhone build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-bible-ipa
      - uses: actions/upload-artifact@v4
        with:
          name: bible-ipa
          path: SmoothBible.ipa

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: compiler
        with:
          path: l8c3
          key: l8c3-${{ hashFiles('bootstrap', 'Makefile', 'tools/step.sh', 'runtime*.s', 'src1/**', 'src2/**', 'stdlib/**') }}
      - name: Build the compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        run: make -j4 l8c3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the web site
        run: make -j4 -o l8c3 bible-web
      - uses: actions/upload-artifact@v4
        with:
          name: bible-web-site
          path: .build/bible-site
