# Smooth Bible (programs/bible), built and run in the iOS simulator.
#
# compile (Linux) builds the compiler (kept in a cache while its sources
# are unchanged) and compiles programs/bible/ios.l8 to arm64 assembly (`l8
# arm64 --target ios`); test, beside it, runs the tests and data checks.
# Five simulator jobs (macOS) start at once, without waiting. The first
# fetches the assembly as soon as it is uploaded (tools/ios/artifact.py),
# assembles and links SmoothBible.app (tools/ios/build.sh, with
# programs/bible/ios) and uploads it for all five, then builds
# SmoothBible.ipa, for an iPhone, onto the ci-bible-ipa branch (ad hoc
# signed). The other four boot their first simulator meanwhile (a first boot
# takes about three minutes) and fetch the app. Each runs two groups of the
# demo one after another (programs/bible/ios/simulate.sh), each on a
# simulator of its own, the second booting while the first group runs; each
# group's shots are uploaded as it ends (shots-GROUP). The groups are paired
# so the five jobs end together: GitHub runs at most five macOS jobs of this
# account at a time, and a sixth would wait for one of them to end.
# frames (Linux) waits for the notes group's
# recording and makes its frames and contact sheet while the others run
# (programs/bible/ios/shots.py transitions). A last Linux job, publish, puts
# the groups' screenshots together (and the collapsing bar's pixel check)
# and pushes them to the ci-bible-shots branch (one commit, each run
# replacing the last). The groups: read, study, notes (which also records
# the screen), more (Round 3's), store (the App Store's screenshots on the
# largest iPhone), ios18 (a few shots on an iOS 18 runtime, if there is
# one), versions, plans, ribbons, listen. (Launches were timed against Round
# 1's app with programs/bible/ios/launch.sh in a job of their own, for
# review r2-1.)
name: Smooth Bible

on:
  push:
    branches: [bible]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# (A push while a run is going waits for it, rather than stopping it, so a
# run always finishes and publishes; of the pushes made meanwhile only the
# newest then runs.)
concurrency:
  group: bible
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: compiler
        with:
          path: l8c3
          key: l8c3-${{ hashFiles('bootstrap', 'Makefile', 'tools/step.sh', 'runtime*.s', 'src1/**', 'src2/**', 'stdlib/**') }}
      - name: Build the compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        run: make -j4 l8c3
      - name: Compile the app for iOS
        run: ./l8c3 arm64 --target ios programs/bible/ios.l8 -o bible-ios.s
      - uses: actions/upload-artifact@v4
        with:
          name: bible-ios-assembly
          path: bible-ios.s

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: compiler
        with:
          path: l8c3
          key: l8c3-${{ hashFiles('bootstrap', 'Makefile', 'tools/step.sh', 'runtime*.s', 'src1/**', 'src2/**', 'stdlib/**') }}
      - name: Build the compiler
        if: steps.compiler.outputs.cache-hit != 'true'
        run: make -j4 l8c3
      - name: Test the text's layout
        run: ./l8c3 test programs/bible/test_text.l8 programs/bible/test_lang.l8 programs/bible/test_store.l8 programs/bible/test_plans.l8 programs/bible/test_ribbons.l8 programs/bible/test_audio.l8
      - name: Check the data (senses, related words, eBible.org's audio paths)
        run: |
          for t in senses related; do python3 -I programs/bible/tools/$t.py --check programs/bible/data; done
          python3 -I programs/bible/tools/web_audio_manifest.py --check programs/bible/data
      - name: Build the spoken text's tool (for the aligner)
        run: ./l8c3 build programs/bible/tools/spoken.l8 -o bible-spoken && ./bible-spoken programs/bible/data/bsb.txt | head -3
      - name: Test the ESV proxy (against fixtures, no key)
        run: node --test programs/bible/worker/test.mjs

  simulator:
    name: simulator (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # (Paired by the groups' times, so the jobs end together; the first
        # job builds the app for all five, and the IPA.)
        include:
          - {name: build store ios18, build: true, g1: store, g2: ios18}
          - {name: notes versions, g1: notes, g2: versions}
          - {name: read study, g1: read, g2: study}
          - {name: plans more, g1: plans, g2: more}
          - {name: ribbons listen, g1: ribbons, g2: listen}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Boot the first group's simulator (a first boot takes minutes)
        if: ${{ !matrix.build }}
        run: |
          mkdir -p devices
          programs/bible/ios/pick.sh ${{ matrix.g1 }} > devices/${{ matrix.g1 }}
          dev=$(cat devices/${{ matrix.g1 }})
          echo "simulator for ${{ matrix.g1 }}: $dev"
          [ -n "$dev" ] && (xcrun simctl boot "$dev" >/dev/null 2>&1 &) || true
      - name: Wait for the assembly
        if: matrix.build
        run: python3 -I tools/ios/artifact.py bible-ios-assembly . compile
      - name: Build SmoothBible.app (for every job's simulator)
        if: matrix.build
        run: |
          BUILD_NUMBER=${{ github.run_number }} tools/ios/build.sh sim bible-ios.s build programs/bible/ios 2>&1 | tee build.log
          mkdir -p app && cp build.log app/ && (cd build && zip -qry ../app/SmoothBible-simulator.zip SmoothBible.app)
      - uses: actions/upload-artifact@v4
        if: matrix.build
        with:
          name: bible-sim-app
          path: app
      - name: Boot the first group's simulator
        if: matrix.build
        run: |
          mkdir -p devices
          programs/bible/ios/pick.sh ${{ matrix.g1 }} > devices/${{ matrix.g1 }}
          dev=$(cat devices/${{ matrix.g1 }})
          echo "simulator for ${{ matrix.g1 }}: $dev"
          [ -n "$dev" ] && (xcrun simctl boot "$dev" >/dev/null 2>&1 &) || true
      - name: Build the app for an iPhone, and push it to ci-bible-ipa
        if: matrix.build
        run: |
          export DEVELOPER_DIR="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          tools/ios/build.sh device bible-ios.s device programs/bible/ios
          mkdir -p ipa/Payload && cp -R device/SmoothBible.app ipa/Payload/
          (cd ipa && zip -qry ../SmoothBible.ipa Payload)
          mkdir -p publish && cp SmoothBible.ipa publish/
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-bible-ipa
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "iPhone build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-bible-ipa
      - uses: actions/upload-artifact@v4
        if: matrix.build
        with:
          name: bible-ipa
          path: SmoothBible.ipa
      - name: Wait for SmoothBible.app (from the first job)
        if: ${{ !matrix.build }}
        id: app
        run: |
          python3 -I tools/ios/artifact.py bible-sim-app app "simulator (build"
          mkdir -p build && (cd build && unzip -q ../app/SmoothBible-simulator.zip) && cp app/build.log .
      - name: The app is here
        id: build
        run: test -d build/SmoothBible.app
      - name: Run its demo's ${{ matrix.g1 }} group in the simulator
        if: always() && matrix.g1 && steps.build.outcome == 'success'
        run: |
          # (The next group's simulator, a new one, boots meanwhile.)
          if [ -n "${{ matrix.g2 }}" ]; then
            programs/bible/ios/pick.sh ${{ matrix.g2 }} new > devices/${{ matrix.g2 }}
            next=$(cat devices/${{ matrix.g2 }})
            echo "simulator for ${{ matrix.g2 }}: $next"
            [ -n "$next" ] && (xcrun simctl boot "$next" >/dev/null 2>&1 &) || true
          fi
          SIM_DEVICE=$(cat devices/${{ matrix.g1 }} 2>/dev/null) programs/bible/ios/simulate.sh build/SmoothBible.app out/${{ matrix.g1 }}/shots ${{ matrix.g1 }}
      - name: Keep the ${{ matrix.g1 }} group's build log (and read's app, for another Mac's simulator)
        if: always() && matrix.g1
        run: |
          mkdir -p out/${{ matrix.g1 }} && cp build.log out/${{ matrix.g1 }}/ 2>/dev/null || true
          [ "${{ matrix.g1 }}" = read ] && cp app/SmoothBible-simulator.zip out/read/ 2>/dev/null || true
          dev=$(cat devices/${{ matrix.g1 }} 2>/dev/null) && [ -n "$dev" ] && xcrun simctl shutdown "$dev" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && matrix.g1
        with:
          name: shots-${{ matrix.g1 }}
          path: out/${{ matrix.g1 }}
      - name: Run its demo's ${{ matrix.g2 }} group in the simulator
        if: always() && matrix.g2 && steps.build.outcome == 'success'
        run: |
          # (The next group's simulator, a new one, boots meanwhile.)
          if [ -n "${{ matrix.g3 }}" ]; then
            programs/bible/ios/pick.sh ${{ matrix.g3 }} new > devices/${{ matrix.g3 }}
            next=$(cat devices/${{ matrix.g3 }})
            echo "simulator for ${{ matrix.g3 }}: $next"
            [ -n "$next" ] && (xcrun simctl boot "$next" >/dev/null 2>&1 &) || true
          fi
          SIM_DEVICE=$(cat devices/${{ matrix.g2 }} 2>/dev/null) programs/bible/ios/simulate.sh build/SmoothBible.app out/${{ matrix.g2 }}/shots ${{ matrix.g2 }}
      - name: Keep the ${{ matrix.g2 }} group's build log (and read's app, for another Mac's simulator)
        if: always() && matrix.g2
        run: |
          mkdir -p out/${{ matrix.g2 }} && cp build.log out/${{ matrix.g2 }}/ 2>/dev/null || true
          [ "${{ matrix.g2 }}" = read ] && cp app/SmoothBible-simulator.zip out/read/ 2>/dev/null || true
          dev=$(cat devices/${{ matrix.g2 }} 2>/dev/null) && [ -n "$dev" ] && xcrun simctl shutdown "$dev" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && matrix.g2
        with:
          name: shots-${{ matrix.g2 }}
          path: out/${{ matrix.g2 }}
      - name: Run its demo's ${{ matrix.g3 }} group in the simulator
        if: always() && matrix.g3 && steps.build.outcome == 'success'
        run: |
          SIM_DEVICE=$(cat devices/${{ matrix.g3 }} 2>/dev/null) programs/bible/ios/simulate.sh build/SmoothBible.app out/${{ matrix.g3 }}/shots ${{ matrix.g3 }}
      - name: Keep the ${{ matrix.g3 }} group's build log (and read's app, for another Mac's simulator)
        if: always() && matrix.g3
        run: |
          mkdir -p out/${{ matrix.g3 }} && cp build.log out/${{ matrix.g3 }}/ 2>/dev/null || true
          [ "${{ matrix.g3 }}" = read ] && cp app/SmoothBible-simulator.zip out/read/ 2>/dev/null || true
          dev=$(cat devices/${{ matrix.g3 }} 2>/dev/null) && [ -n "$dev" ] && xcrun simctl shutdown "$dev" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always() && matrix.g3
        with:
          name: shots-${{ matrix.g3 }}
          path: out/${{ matrix.g3 }}

  frames:
    # The notes group's recording, made into frames while the other groups
    # still run. (Never keeping the shots from being published.)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Pillow and PyAV
        # (Wheels only, so a runner without them fails fast rather than compiling.)
        run: |
          python3 -m venv venv
          timeout 300 venv/bin/pip install --quiet --only-binary=:all: pillow av || echo "frames: no wheels"
      - name: Wait for the notes group
        run: python3 -I tools/ios/artifact.py shots-notes notes simulator
      - name: The recording's frames
        run: |
          mkdir -p frames
          cp notes/shots/transitions.mp4 notes/shots/transitions.txt frames/ 2>/dev/null || true
          timeout 600 venv/bin/python programs/bible/ios/shots.py frames transitions | tee frames.txt || true
          rm -f frames/transitions.mp4 frames/transitions.txt
          mv frames.txt frames/frames.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frames
          path: frames

  publish:
    needs: [simulator, frames]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: groups
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frames
          path: frames
      - name: Put the groups together
        run: |
          mkdir -p publish
          for g in read study notes more store ios18 versions plans ribbons listen; do
            s=groups/shots-$g/shots
            [ -d "$s" ] || continue
            cp "$s"/*.png publish/ 2>/dev/null || true
            for f in "$s"/*; do
              case "$f" in *.png) ;; *) cp -r "$f" "publish/$g-$(basename "$f")" ;; esac
            done
            cp groups/shots-$g/build.log publish/$g-build.log 2>/dev/null || true
          done
          mv publish/notes-transitions.mp4 publish/transitions.mp4 2>/dev/null || true
          mv publish/more-notes-export.md publish/notes-export.md 2>/dev/null || true
          cat publish/store-plain-launch.txt publish/ios18-ios18.txt 2>/dev/null || true
          mv publish/notes-transitions.txt publish/transitions.txt 2>/dev/null || true
      - name: The collapsing bar's pixel check, and the recording's frames (from frames)
        # (Never keeping the shots from being published.)
        continue-on-error: true
        run: |
          python3 -m venv venv
          timeout 300 venv/bin/pip install --quiet --only-binary=:all: pillow || echo "pixel check: no wheels"
          timeout 300 venv/bin/python programs/bible/ios/shots.py publish collapse | tee -a publish/read-log.txt || true
          if [ -f frames/frames.txt ]; then
            cat frames/frames.txt | tee -a publish/read-log.txt
            rm frames/frames.txt
            cp -R frames/. publish/
          else
            echo "transitions failed: no frames from the frames job" | tee -a publish/read-log.txt
          fi
      - name: Push the screenshots to ci-bible-shots
        if: always()
        run: |
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID}" > publish/RUN.txt
          cd publish
          git init -q -b ci-bible-shots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Simulator run ${GITHUB_RUN_ID} of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-bible-shots
