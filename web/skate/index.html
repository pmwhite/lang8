<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Sketchy Landing">
<meta property="og:title" content="Sketchy Landing">
<meta name="description" content="A skateboarding game.">
<title>Sketchy Landing</title>
<!-- Everything the game needs, fetched together rather than one after
     another as each asks for the next. -->
<link rel="modulepreload" href="skate.js">
<link rel="modulepreload" href="pace.js">
<link rel="modulepreload" href="../l8-runtime.js">
<link rel="modulepreload" href="../game/platform.js">
<link rel="modulepreload" href="../game/control.js">
<link rel="preload" href="skate.wasm" as="fetch" type="application/wasm" crossorigin>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  body {
    background: #000;
    color: #fff8ec;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100dvh;
    display: grid;
    place-items: center;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Everything over the game is drawn by the game (see skate.js). */
  canvas { display: block; background: #000; outline: none; touch-action: none; }
  /* Until the game has drawn anything: a plain ground, and that it is
     coming. */
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0e14; pointer-events: none; transition: opacity 0.4s ease, visibility 0.4s; }
  body:not(.booting) #boot { opacity: 0; visibility: hidden; }
  #boot i { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(255, 248, 236, 0.22); border-top-color: #fff8ec; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* The edges a phone keeps for itself, measured (see sendView). */
  #safe { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* If the game stops, the page says so. */
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; }
  #overlay[hidden] { display: none; }
  #overlay div { background: rgba(14, 16, 20, 0.92); border: 1px solid #323846; border-radius: 12px; padding: 18px 26px; text-align: center; max-width: 520px; }
  #overlay a { color: #ffd36b; }
</style>
</head>
<body class="booting">
<script>
  // (Before the page is first drawn, as skate.js will find it: whether this
  // is a touch screen.)
  if (matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 0) document.body.classList.add("touch");
</script>
<canvas id="screen" width="1200" height="720" tabindex="0" aria-label="Sketchy Landing"></canvas>
<div id="boot" aria-hidden="true"><i></i></div>
<div id="safe" aria-hidden="true"></div>
<div id="overlay" hidden><div id="message"></div></div>
<script type="module" src="skate.js"></script>
</body>
</html>
