# The people every game shares (worker.js), at trailingwhite.space/people/api/.
#   npx wrangler d1 execute people --remote --file schema.sql
#   npx wrangler deploy
#   npx wrangler secret put ADMIN_SECRET        (the same as the skate leaderboards')
name = "people"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "trailingwhite.space/people/api/*", zone_name = "trailingwhite.space" }]
workers_dev = false

# (Bound as PEOPLE here and in each game's Worker that asks who is who: see
# people.js.)
[[d1_databases]]
binding = "PEOPLE"
database_name = "people"
database_id = "47e8f059-c368-4bc5-99bc-8ec520215503"

# At most this many requests a minute from one address.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1004"
simple = { limit = 120, period = 60 }
