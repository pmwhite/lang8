<!doctype html>
<html lang="en" data-theme="auto" data-font="serif" data-spacing="normal" data-margins="normal" data-vn="1" data-heads="1" data-fns="1" data-red="0" data-version="bsb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta property="og:title" content="{{og_title}}">
<!--sb-head-->
<meta property="og:image" content="https://smoothbible.com/img/icon.png">
<meta property="og:site_name" content="Smooth Bible">
<link rel="icon" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#FBF8F2">
<link rel="stylesheet" href="/read/{{css}}">
<link rel="modulepreload" href="/read/{{js}}">
<link rel="modulepreload" href="/read/{{dom}}">
<link rel="modulepreload" href="/read/{{runtime}}">
<meta name="sb-app" content="{{js}}">
<meta name="sb-wasm" content="{{wasm}}">
<meta name="sb-data" content="{{data}}">
<script>{{boot}}</script>
</head>
<body>
<a class="skip" href="#text">Skip to the text</a>
<header class="bar">
<nav aria-label="Reader">
<a class="ib search" href="/read/search" aria-label="Search"><svg aria-hidden="true"><use href="/read/{{icons}}#search"></use></svg></a>
<a class="title" href="/read/bsb/" aria-label="{{bar_title}}" aria-haspopup="dialog"><span class="tt"><span class="t">{{bar_title}}</span></span><svg class="chev" aria-hidden="true"><use href="/read/{{icons}}#chevron-down"></use></svg></a>
<button class="ib aa" type="button" aria-label="Reading Settings" aria-haspopup="dialog"><svg aria-hidden="true"><use href="/read/{{icons}}#a-large-small"></use></svg></button>
</nav>
</header>
<h1 class="vh">{{h1}}</h1>
<main id="text">
{{main}}</main>
<footer class="credit"><p><span class="cv">{{credit}}</span> · <a href="/read/about">About</a></p></footer>
</body>
</html>
