# The recipe book's kitchens (worker.js), at trailingwhite.space/recipes/api/.
#   npx wrangler d1 execute recipe-book --remote --file schema.sql
#   npx wrangler deploy
name = "recipe-book"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "trailingwhite.space/recipes/api/*", zone_name = "trailingwhite.space" }]
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "recipe-book"
database_id = "TO BE MADE: npx wrangler d1 create recipe-book"

# At most this many requests a minute from one address.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
