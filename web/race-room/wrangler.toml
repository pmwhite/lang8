# The racing game's rooms (worker.js), at trailingwhite.space/race/api/.
#   npx wrangler dev --ip 0.0.0.0 --port 8787     to try it on this machine
#   npx wrangler deploy
#   npx wrangler secret put KEYS                the keys that open the game (see worker.js)
name = "race-room"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "trailingwhite.space/race/api/*", zone_name = "trailingwhite.space" }]
workers_dev = false

# A room is a Durable Object: one of them for each room's name, wherever its
# people are.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
