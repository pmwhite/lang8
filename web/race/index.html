<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>L8 Race</title>
<style>
  /* (Nothing on the page is text to select: a long press, or a drag, is
     driving. The game draws its own menus: see programs/race/ui.l8.) */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; outline: none; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #message { padding: 12px 22px; border-radius: 10px; background: rgba(20, 22, 26, 0.75); color: #fff; font-size: 15px; }
  #overlay a { color: #7ea6ff; pointer-events: auto; }
  #overlay[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="screen" width="1200" height="720" tabindex="0" aria-label="L8 Race"></canvas>
<div id="overlay"><div id="message">Loading&hellip;</div></div>
<script type="module" src="race.js"></script>
</body>
</html>
