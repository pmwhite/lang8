# Better's logs (worker.js), at trailingwhite.space/better/api/.
#   npx wrangler d1 execute better-log --remote --file schema.sql
#   (a database made before accounts: --file migrate-1.sql, once, first)
#   npx wrangler deploy
name = "better-log"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "trailingwhite.space/better/api/*", zone_name = "trailingwhite.space" },
  # (Its name before: for iPhones not yet updated.)
  { pattern = "trailingwhite.space/tempo/api/*", zone_name = "trailingwhite.space" },
]
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "better-log"
database_id = "c3463232-2441-4ee0-9dc5-b5243ea70fa1"

# At most this many requests a minute from one address.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

# And at most this many tries of a code (they could be guessed at).
[[ratelimits]]
name = "CODE_LIMIT"
namespace_id = "1004"
simple = { limit = 10, period = 60 }
