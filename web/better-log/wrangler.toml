# Better's logs (worker.js), at trailingwhite.space/better/api/.
#   npx wrangler d1 execute better-log --remote --file schema.sql
#   npx wrangler deploy
name = "better-log"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "trailingwhite.space/better/api/*", zone_name = "trailingwhite.space" },
  # (Its name before: for iPhones not yet updated.)
  { pattern = "trailingwhite.space/tempo/api/*", zone_name = "trailingwhite.space" },
]
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "better-log"
database_id = "cbedf285-8f14-4bc4-858d-2ca86626f60a"

# At most this many requests a minute from one address.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1003"
simple = { limit = 120, period = 60 }
