# The skate leaderboards (worker.js), at trailingwhite.space/skate/api/.
#   npx wrangler deploy
#   npx wrangler d1 execute skate-board --remote --file schema.sql
name = "skate-board"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "trailingwhite.space/skate/api/*", zone_name = "trailingwhite.space" }]
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "skate-board"
database_id = "d96f75a1-4774-45a9-9eeb-4cfab414cf2a"

# At most this many requests a minute from one address.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
