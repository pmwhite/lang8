<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1015">
<meta name="apple-mobile-web-app-title" content="CAD">
<title>CAD</title>
<link rel="modulepreload" href="cad.js">
<link rel="modulepreload" href="../l8-runtime.js">
<link rel="modulepreload" href="../game/platform.js">
<link rel="preload" href="cad.wasm" as="fetch" type="application/wasm" crossorigin>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body {
    background: #0d1015; color: #eef2f6; height: 100dvh; display: grid; place-items: center;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* Everything on the page is drawn by the editor (see cad.js). */
  canvas { display: block; background: #0d1015; outline: none; touch-action: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0d1015; pointer-events: none; transition: opacity 0.35s ease, visibility 0.35s; }
  body:not(.booting) #boot { opacity: 0; visibility: hidden; }
  #boot i { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(238, 242, 246, 0.2); border-top-color: #5ccfff; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* The edges a phone keeps for itself, measured (see sendSafe). */
  #safe { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* Unseen links over the editor's own buttons that open another site or
     save a file: such a tap has to be the page's (see cad.js). */
  #links a { position: fixed; display: block; background: transparent; -webkit-tap-highlight-color: transparent; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; }
  #overlay[hidden] { display: none; }
  #overlay div { background: rgba(21, 26, 33, 0.95); border: 1px solid #2c3542; border-radius: 14px; padding: 18px 26px; text-align: center; max-width: 520px; }
  #overlay a { color: #5ccfff; }
</style>
</head>
<body class="booting">
<canvas id="screen" width="1200" height="720" tabindex="0" aria-label="CAD"></canvas>
<div id="boot" aria-hidden="true"><i></i></div>
<div id="safe" aria-hidden="true"></div>
<div id="links"></div>
<div id="overlay" hidden><div id="message"></div></div>
<script type="module" src="cad.js"></script>
</body>
</html>
