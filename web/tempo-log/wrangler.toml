# Tempo's logs (worker.js), at trailingwhite.space/tempo/api/.
#   npx wrangler d1 execute tempo-log --remote --file schema.sql
#   npx wrangler deploy
name = "tempo-log"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "trailingwhite.space/tempo/api/*", zone_name = "trailingwhite.space" }]
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "tempo-log"
database_id = "cbedf285-8f14-4bc4-858d-2ca86626f60a"

# At most this many requests a minute from one address.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1003"
simple = { limit = 120, period = 60 }
