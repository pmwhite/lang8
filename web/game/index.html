<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="L8 Blocks">
<meta name="theme-color" content="#0e1014">
<link rel="manifest" href="manifest.webmanifest">
<title>L8 block game</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    background: #0e1014;
    color: #d7dbe3;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: max(8px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left));
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .hint { color: #8b93a5; }
  header nav { margin-left: auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  a { color: #7ea6ff; }
  button, select {
    font: inherit;
    color: inherit;
    background: #1c2029;
    border: 1px solid #323846;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .stage {
    flex: 1;
    min-height: 0;
    position: relative;
    display: grid;
    place-items: center;
    touch-action: none;
  }
  canvas {
    display: block;
    background: #000;
    border-radius: 6px;
    outline: none;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    touch-action: none;
  }
  canvas:focus-visible { box-shadow: 0 0 0 2px #7ea6ff, 0 8px 40px rgba(0, 0, 0, 0.5); }
  #overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  #overlay div {
    background: rgba(14, 16, 20, 0.85);
    border: 1px solid #323846;
    border-radius: 10px;
    padding: 18px 26px;
    text-align: center;
    max-width: 520px;
  }
  #overlay[hidden] { display: none; }

  /* Immersive: the game fills the screen (iPhone has no Fullscreen API). */
  body.immersive header, body.immersive #logbox { display: none; }
  body.immersive canvas { border-radius: 0; box-shadow: none; }
  #exit-immersive {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    right: max(8px, env(safe-area-inset-right));
    display: none;
    z-index: 3;
    opacity: 0.7;
  }
  body.immersive #exit-immersive { display: block; }

  /* Touch controls, over the game's side bars or corners. */
  .controls { display: none; }
  body.touch .controls { display: block; }
  .pad, .actions {
    position: absolute;
    bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 2;
    display: grid;
    gap: 8px;
    touch-action: none;
  }
  .pad {
    left: max(14px, env(safe-area-inset-left));
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(3, 58px);
  }
  .actions {
    right: max(14px, env(safe-area-inset-right));
    grid-template-columns: repeat(2, 72px);
  }
  .key {
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: rgba(28, 32, 41, 0.55);
    border: 1px solid rgba(126, 166, 255, 0.35);
    color: #e6e9f0;
    font-size: 22px;
    font-weight: 600;
    touch-action: none;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .actions .key { height: 52px; font-size: 14px; }
  .key.held { background: rgba(126, 166, 255, 0.45); }
  .pad .at-up { grid-column: 2; grid-row: 1; }
  .pad .at-left { grid-column: 1; grid-row: 2; }
  .pad .at-right { grid-column: 3; grid-row: 2; }
  .pad .at-down { grid-column: 2; grid-row: 3; }
  /* Landscape phones: a one-line header and smaller keys. */
  @media (max-height: 500px) {
    header h1, header .hint { display: none; }
    header { padding-top: max(4px, env(safe-area-inset-top)); padding-bottom: 4px; }
    .pad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 6px; }
    .actions { grid-template-columns: repeat(2, 64px); gap: 6px; }
    .actions .key { height: 44px; }
  }
  #rotate {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(14, 16, 20, 0.85);
    border: 1px solid #323846;
    border-radius: 8px;
    padding: 6px 12px;
    color: #8b93a5;
    font-size: 13px;
    display: none;
    z-index: 2;
  }
  @media (orientation: portrait) {
    body.touch #rotate { display: block; }
  }

  #logbox {
    position: fixed;
    left: max(12px, env(safe-area-inset-left));
    bottom: max(10px, env(safe-area-inset-bottom));
    max-width: min(640px, calc(100vw - 24px));
    background: rgba(14, 16, 20, 0.92);
    border: 1px solid #323846;
    border-radius: 8px;
    padding: 4px 10px;
    color: #8b93a5;
    z-index: 4;
  }
  body.touch #logbox { display: none; }
  #logbox summary { cursor: pointer; font-size: 12px; }
  #log {
    margin: 6px 0;
    max-height: 30vh;
    overflow: auto;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<header>
  <h1>L8 block game</h1>
  <span class="hint" id="hint">Arrows move &middot; J travels &middot; Backspace undoes &middot; Shift+Backspace restarts the room</span>
  <nav>
    <select id="level" aria-label="Level"></select>
    <a id="mode" href="?edit">Open the editor</a>
    <button id="reset" title="Forget saved progress and edits">Reset world</button>
    <button id="fullscreen" title="Fill the screen">Full screen</button>
    <a href="../">Playground</a>
  </nav>
</header>
<div class="stage" id="stage">
  <canvas id="screen" width="1200" height="720" tabindex="0" aria-label="Game"></canvas>
  <div id="overlay"><div id="message">Loading&hellip;</div></div>
  <button id="exit-immersive" aria-label="Leave full screen">&#x2715;</button>
  <div id="rotate">Turn your phone sideways for a bigger view</div>
  <div class="controls" aria-hidden="true">
    <div class="pad">
      <div class="key at-up" data-key="65362">&#x25B2;</div>
      <div class="key at-left" data-key="65361">&#x25C0;</div>
      <div class="key at-right" data-key="65363">&#x25B6;</div>
      <div class="key at-down" data-key="65364">&#x25BC;</div>
    </div>
    <div class="actions">
      <div class="key" data-key="65288">Undo</div>
      <div class="key" data-key="65288" data-shift="1">Restart</div>
      <div class="key" data-key="106" data-text="j">Travel</div>
      <div class="key" data-key="65293" data-text="&#13;">OK</div>
    </div>
  </div>
</div>
<details id="logbox"><summary>Log</summary><pre id="log"></pre></details>
<script type="module" src="game.js"></script>
</body>
</html>
