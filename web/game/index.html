<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L8 block game</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0e1014;
    color: #d7dbe3;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; }
  header .hint { color: #8b93a5; }
  header nav { margin-left: auto; display: flex; gap: 14px; align-items: center; }
  a { color: #7ea6ff; }
  button, select {
    font: inherit;
    color: inherit;
    background: #1c2029;
    border: 1px solid #323846;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .stage {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 0 16px 12px;
    position: relative;
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 5 / 3;
    width: min(100%, calc((100vh - 120px) * 5 / 3));
    height: auto;
    background: #000;
    border-radius: 6px;
    outline: none;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
  }
  canvas:focus-visible { box-shadow: 0 0 0 2px #7ea6ff, 0 8px 40px rgba(0, 0, 0, 0.5); }
  #overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  #overlay div {
    background: rgba(14, 16, 20, 0.85);
    border: 1px solid #323846;
    border-radius: 10px;
    padding: 18px 26px;
    text-align: center;
    max-width: 520px;
  }
  #overlay[hidden] { display: none; }
  #logbox {
    position: fixed;
    left: 12px;
    bottom: 10px;
    max-width: min(640px, calc(100vw - 24px));
    background: rgba(14, 16, 20, 0.92);
    border: 1px solid #323846;
    border-radius: 8px;
    padding: 4px 10px;
    color: #8b93a5;
  }
  #logbox summary { cursor: pointer; font-size: 12px; }
  #log {
    margin: 6px 0;
    max-height: 30vh;
    overflow: auto;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<header>
  <h1>L8 block game</h1>
  <span class="hint" id="hint">Arrows move &middot; J travels &middot; Backspace undoes &middot; Shift+Backspace restarts the room</span>
  <nav>
    <select id="level" aria-label="Level"></select>
    <a id="mode" href="?edit">Open the editor</a>
    <button id="reset" title="Forget saved progress and edits">Reset world</button>
    <a href="../">Playground</a>
  </nav>
</header>
<div class="stage">
  <canvas id="screen" width="1200" height="720" tabindex="0" aria-label="Game"></canvas>
  <div id="overlay"><div id="message">Loading&hellip;</div></div>
</div>
<details id="logbox"><summary>Log</summary><pre id="log"></pre></details>
<script type="module" src="game.js"></script>
</body>
</html>
