<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="L8 Blocks">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<title>L8 block game</title>
<style>
  * { box-sizing: border-box; }
  /* No browser gestures anywhere: no double-tap zoom, pinch, or scrolling. */
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  body {
    background: #000;
    color: #d7dbe3;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100dvh;
    display: grid;
    place-items: center;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    background: #000;
    outline: none;
    touch-action: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
  }
  #overlay div {
    background: rgba(14, 16, 20, 0.85);
    border: 1px solid #323846;
    border-radius: 10px;
    padding: 18px 26px;
    text-align: center;
    max-width: 520px;
  }
  #overlay a { color: #7ea6ff; pointer-events: auto; }
  #overlay[hidden] { display: none; }

  /* Touch controls, over the game's side bars or corners. */
  .controls { display: none; }
  body.touch .controls { display: block; }
  .pad, .actions {
    position: fixed;
    bottom: max(14px, env(safe-area-inset-bottom));
    display: grid;
    gap: 8px;
  }
  .pad {
    left: max(14px, env(safe-area-inset-left));
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(3, 58px);
  }
  .actions {
    right: max(14px, env(safe-area-inset-right));
    grid-template-columns: repeat(2, 72px);
  }
  .key {
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: rgba(28, 32, 41, 0.55);
    border: 1px solid rgba(126, 166, 255, 0.35);
    color: #e6e9f0;
    font-size: 22px;
    font-weight: 600;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .actions .key { height: 52px; font-size: 14px; }
  .key.held { background: rgba(126, 166, 255, 0.45); }
  .pad .at-up { grid-column: 2; grid-row: 1; }
  .pad .at-left { grid-column: 1; grid-row: 2; }
  .pad .at-right { grid-column: 3; grid-row: 2; }
  .pad .at-down { grid-column: 2; grid-row: 3; }
  /* Landscape phones: smaller keys. */
  @media (max-height: 500px) {
    .pad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 6px; }
    .actions { grid-template-columns: repeat(2, 64px); gap: 6px; }
    .actions .key { height: 44px; }
  }
  /* The game's frame-time view, F3 on a keyboard. */
  .controls .corner {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    width: 52px;
    height: 32px;
    font-size: 12px;
    border-radius: 10px;
  }
  #rotate {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(14, 16, 20, 0.85);
    border: 1px solid #323846;
    border-radius: 8px;
    padding: 6px 12px;
    color: #8b93a5;
    font-size: 13px;
    display: none;
  }
  @media (orientation: portrait) {
    body.touch #rotate { display: block; }
  }
</style>
</head>
<body>
<canvas id="screen" width="1200" height="720" tabindex="0" aria-label="L8 block game"></canvas>
<div id="overlay"><div id="message">Loading&hellip;</div></div>
<div id="rotate">Turn your phone sideways for a bigger view</div>
<div class="controls" aria-hidden="true">
  <div class="pad">
    <div class="key at-up" data-key="65362">&#x25B2;</div>
    <div class="key at-left" data-key="65361">&#x25C0;</div>
    <div class="key at-right" data-key="65363">&#x25B6;</div>
    <div class="key at-down" data-key="65364">&#x25BC;</div>
  </div>
  <div class="actions">
    <div class="key" data-key="65288">Undo</div>
    <div class="key" data-key="65288" data-shift="1">Restart</div>
    <div class="key" data-key="106" data-text="j">Travel</div>
    <div class="key" data-key="65293" data-text="&#13;">OK</div>
  </div>
  <div class="key corner" data-key="65472">FPS</div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
