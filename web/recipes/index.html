<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-title" content="Recipes">
<title>Recipes</title>
<link rel="modulepreload" href="recipes.js">
<link rel="modulepreload" href="../l8-runtime.js">
<link rel="modulepreload" href="../game/platform.js">
<link rel="preload" href="recipes.wasm" as="fetch" type="application/wasm" crossorigin>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body {
    background: #f6f1e7; color: #2b261f; height: 100dvh; display: grid; place-items: center;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* Everything on the page is drawn by the book (see recipes.js). */
  canvas { display: block; background: #f6f1e7; outline: none; touch-action: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f6f1e7; pointer-events: none; transition: opacity 0.35s ease, visibility 0.35s; }
  body:not(.booting) #boot { opacity: 0; visibility: hidden; }
  #boot i { width: 20px; height: 20px; border-radius: 50%; border: 3px solid rgba(43, 38, 31, 0.15); border-top-color: #3f7d4e; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* The edges a phone keeps for itself, measured (see sendSafe). */
  #safe { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* Laid over the search field the book draws, unseen: a finger on it
     brings up a phone's keyboard, and what is typed goes to the book. */
  #type { position: fixed; left: 0; top: 0; width: 0; height: 0; padding: 0; margin: 0; border: 0; opacity: 0; font-size: 16px; background: transparent; color: transparent; caret-color: transparent; outline: none; -webkit-user-select: text; user-select: text; }
  #type[hidden] { display: none; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; }
  #overlay[hidden] { display: none; }
  #overlay div { background: #fffdf8; border: 1px solid #e6dece; border-radius: 14px; padding: 18px 26px; text-align: center; max-width: 520px; }
  #overlay a { color: #3f7d4e; }
  #overlay div { max-height: calc(100dvh - 32px); overflow: auto; }
</style>
</head>
<body class="booting">
<canvas id="screen" width="1200" height="720" tabindex="0" aria-label="Recipes"></canvas>
<input id="type" class="ui" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search" hidden>
<div id="boot" aria-hidden="true"><i></i></div>
<div id="safe" aria-hidden="true"></div>
<div id="overlay" hidden><div id="message"></div></div>
<script type="module" src="recipes.js"></script>
</body>
</html>
