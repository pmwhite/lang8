<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dom.l8</title>
</head>
<body>
<!-- web/tests/dom.l8 (built as dom.wasm beside this page) checks the page bridge here. -->
<div id="root"></div>
<script type="module">
import { instantiate, runStart } from "./l8-runtime.js";
import { domHost } from "./dom.js";

window.l8_results = [];
// What the page saw after the module's listeners ran.
for (const type of ["keydown", "wheel"]) addEventListener(type, (e) => setTimeout(() => (window["l8_prevented_" + (e.key || type)] = e.defaultPrevented)), { passive: true });

// A quarter second of 440 Hz, 8 kHz 16-bit mono.
const rate = 8000, n = rate / 4, wav = new DataView(new ArrayBuffer(44 + 2 * n));
const put = (at, s) => [...s].forEach((c, i) => wav.setUint8(at + i, c.charCodeAt(0)));
put(0, "RIFF"); wav.setUint32(4, 36 + 2 * n, true); put(8, "WAVEfmt "); wav.setUint32(16, 16, true);
wav.setUint16(20, 1, true); wav.setUint16(22, 1, true); wav.setUint32(24, rate, true); wav.setUint32(28, 2 * rate, true);
wav.setUint16(32, 2, true); wav.setUint16(34, 16, true); put(36, "data"); wav.setUint32(40, 2 * n, true);
for (let i = 0; i < n; i++) wav.setInt16(44 + 2 * i, Math.round(8000 * Math.sin((2 * Math.PI * 440 * i) / rate)), true);
window.l8_tone = URL.createObjectURL(new Blob([wav.buffer], { type: "audio/wav" }));

const sys = { args: ["dom"], env: [], write: (fd, d) => (console.log(new TextDecoder().decode(d)), d.length), read: () => -9, open: () => -2, close: () => -9 };
const module = await WebAssembly.compileStreaming(fetch("dom.wasm"));
const dom = domHost();
const { instance } = await instantiate(module, sys, dom.imports);
dom.attach(instance);
window.l8_status = runStart(instance);
</script>
</body>
</html>
