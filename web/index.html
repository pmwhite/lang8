<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L8 Playground</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1d2330;
    --muted: #677085;
    --line: #dde1e8;
    --accent: #2f6fed;
    --accent-ink: #ffffff;
    --error: #c92a2a;
    --ok: #2b8a3e;
    --code-bg: #fbfbfc;
    --gutter: #9aa1b1;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d;
      --panel: #1b1f27;
      --ink: #e4e7ee;
      --muted: #9097a8;
      --line: #2c323d;
      --accent: #5b8cff;
      --error: #ff6b6b;
      --ok: #69db7c;
      --code-bg: #171a21;
      --gutter: #5d6577;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 14px 20px 6px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  header nav { margin-left: auto; }
  a { color: var(--accent); }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    flex-wrap: wrap;
  }
  button, select {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 7px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  kbd { font: 12px var(--mono); opacity: 0.8; }
  #status { color: var(--muted); margin-left: 6px; font-size: 14px; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 14px;
    padding: 6px 20px 20px;
    min-height: 0;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 60vh 40vh; }
  }
  .pane {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .pane h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
  }
  .editor {
    flex: 1;
    display: flex;
    min-height: 0;
    background: var(--code-bg);
    font: 14px/1.5 var(--mono);
  }
  #gutter {
    padding: 10px 8px 10px 12px;
    color: var(--gutter);
    text-align: right;
    user-select: none;
    overflow: hidden;
    white-space: pre;
    min-width: 3.2em;
  }
  #source {
    flex: 1;
    border: 0;
    outline: none;
    resize: none;
    padding: 10px 12px 10px 4px;
    font: inherit;
    color: var(--ink);
    background: transparent;
    white-space: pre;
    overflow: auto;
    tab-size: 4;
  }
  #output {
    flex: 1;
    margin: 0;
    padding: 10px 12px;
    overflow: auto;
    font: 13.5px/1.45 var(--mono);
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--code-bg);
  }
  #output .err { color: var(--error); }
  #output .note { color: var(--muted); }
  #output .ok { color: var(--ok); }
  #output a.loc { color: inherit; text-decoration: underline dotted; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>L8 Playground</h1>
  <p>The self-hosted L8 compiler, compiled to WebAssembly and running in your browser.</p>
  <nav><a href="game/">Play the block game &rarr;</a></nav>
</header>
<div class="toolbar">
  <select id="examples" aria-label="Examples"></select>
  <button id="run" class="primary" disabled>Run <kbd>Ctrl+Enter</kbd></button>
  <button id="stop" disabled>Stop</button>
  <button id="format" disabled>Format</button>
  <span id="status">Loading the compiler&hellip;</span>
</div>
<main>
  <section class="pane">
    <h2><span>main.l8</span><span id="cursor"></span></h2>
    <div class="editor">
      <div id="gutter">1</div>
      <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Source code"></textarea>
    </div>
  </section>
  <section class="pane">
    <h2><span>Output</span><span id="timing"></span></h2>
    <pre id="output"></pre>
  </section>
</main>
<script type="module" src="playground.js"></script>
</body>
</html>
