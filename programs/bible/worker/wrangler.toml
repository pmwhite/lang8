# Smooth Bible's ESV proxy (worker.js), at smoothbible.com/api/. Not yet
# deployed: see programs/bible/README.md for the steps, each with the
# owner's consent.
#   npx wrangler d1 create smooth-bible-api      (its id into database_id)
#   npx wrangler d1 execute smooth-bible-api --remote --file schema.sql
#   npx wrangler secret put ESV_KEY < ~/.config/smooth-bible/esv-key
#   npx wrangler deploy
name = "smooth-bible-api"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "smoothbible.com/api/*", zone_name = "smoothbible.com" }]
workers_dev = false

[vars]
UPSTREAM = "https://api.esv.org"

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "smooth-bible-api"
database_id = "(made at deploy)"

# At most this many requests a minute from one address.
[[ratelimits]]
name = "PER_IP"
namespace_id = "1101"
simple = { limit = 30, period = 60 }

# Secret: ESV_KEY (wrangler secret put ESV_KEY).
