# smoothbible.com: the site's pages (../site) and Smooth Bible's ESV proxy
# (worker.js) at /api/. See programs/bible/README.md for the steps, each
# with the owner's consent.
#   npx wrangler d1 create smooth-bible-api      (its id into database_id)
#   npx wrangler d1 execute smooth-bible-api --remote --file schema.sql
#   npx wrangler secret put ESV_KEY < ~/.config/smooth-bible/esv-key
#   npx wrangler deploy
name = "smooth-bible-api"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "smoothbible.com", custom_domain = true },
  { pattern = "www.smoothbible.com", custom_domain = true },
]
workers_dev = false

# The pages; the worker runs first (to send www to the bare name, and the
# API to itself).
[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
UPSTREAM = "https://api.esv.org"

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "smooth-bible-api"
database_id = "91125774-9a21-4d8d-8a4b-b8456653a029"

# At most this many requests a minute from one address.
[[ratelimits]]
name = "PER_IP"
namespace_id = "1101"
simple = { limit = 30, period = 60 }

# Secret: ESV_KEY (wrangler secret put ESV_KEY).
