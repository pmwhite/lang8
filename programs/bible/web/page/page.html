<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta property="og:title" content="{{og_title}}">
<!--sb-head-->
<meta property="og:image" content="https://smoothbible.com/img/icon.png">
<meta property="og:site_name" content="Smooth Bible">
<link rel="icon" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#FBF8F2">
<link rel="stylesheet" href="/read/{{css}}">
<link rel="modulepreload" href="/read/{{js}}">
<link rel="modulepreload" href="/read/{{runtime}}">
<meta name="sb-app" content="{{js}}">
<meta name="sb-wasm" content="{{wasm}}">
<meta name="sb-data" content="{{data}}">
<meta name="sb-icons" content="{{icons}}">
<script>{{boot}}</script>
</head>
<body>
<header class="bar">
<nav aria-label="Reader">
<button class="title" type="button" aria-label="Smooth Bible" aria-haspopup="dialog"><span class="t">{{bar_title}}</span></button>
<span class="gap"></span>
<button class="ib library" type="button" aria-label="Library"><svg aria-hidden="true"><use href="/read/{{icons}}#library"></use></svg></button>
<button class="ib search" type="button" aria-label="Search"><svg aria-hidden="true"><use href="/read/{{icons}}#search"></use></svg></button>
<button class="version" type="button" aria-label="Version"></button>
<button class="ib aa" type="button" aria-label="Reading Settings"><svg aria-hidden="true"><use href="/read/{{icons}}#a-large-small"></use></svg></button>
</nav>
</header>
<main id="reader">
{{main}}</main>
</body>
</html>
