<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Smooth Bible's icon: an open book, its ribbon hanging from the fold,
       on the app's brick red. Drawn to AppIcon.png (1024 square). Its dark and
       tinted appearances (iOS 18), AppIcon-dark.png and AppIcon-tinted.png,
       are AppIcon.png's mark (cut out by this drawing in flat white) on a
       near-black ground (#26231F to #121110), and in gray on nothing. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A2412F"/>
      <stop offset="1" stop-color="#76271C"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4ECDD"/>
      <stop offset="1" stop-color="#E4D7C0"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4D7C0"/>
      <stop offset="1" stop-color="#F7F0E3"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- the pages -->
  <path d="M512 330 C 430 280, 300 270, 196 300 L 196 720 C 300 690, 430 700, 512 750 Z" fill="url(#left)"/>
  <path d="M512 330 C 594 280, 724 270, 828 300 L 828 720 C 724 690, 594 700, 512 750 Z" fill="url(#right)"/>
  <!-- lines of text, faint -->
  <g stroke="#C9B89A" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M262 380 C 330 366, 400 368, 462 392"/>
    <path d="M262 446 C 330 432, 400 434, 462 458"/>
    <path d="M262 512 C 330 498, 400 500, 462 524"/>
    <path d="M262 578 C 330 564, 400 566, 462 590"/>
    <path d="M562 392 C 624 368, 694 366, 762 380"/>
    <path d="M562 458 C 624 434, 694 432, 762 446"/>
    <path d="M562 524 C 624 500, 694 498, 762 512"/>
    <path d="M562 590 C 624 566, 694 564, 762 578"/>
  </g>
  <!-- the ribbon -->
  <path d="M486 712 L 486 872 L 512 846 L 538 872 L 538 712 C 530 718, 520 724, 512 730 C 504 724, 494 718, 486 712 Z" fill="#E2B04A"/>
</svg>
