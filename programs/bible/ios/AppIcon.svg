<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Smooth Bible's icon: bet (ב, with its dagesh), the letter the Bible
       begins with (בְּרֵאשִׁית, "In the beginning"), drawn as a book face's
       square letter in the app's red on the page's cream. Drawn to AppIcon.png
       (1024 square) in Chromium. Its dark and tinted appearances (iOS 18) are
       this drawing too, chosen by the URL's fragment: AppIcon.svg#dark is the
       letter in the Night accent on a near-black ground (#262320 to #121110),
       drawn to AppIcon-dark.png; AppIcon.svg#tinted is the letter in light gray
       on nothing (Chromium with a transparent background), drawn to
       AppIcon-tinted.png. -->
  <style>
    .page { fill: url(#page); }
    .mark { fill: #9C3A2C; }
    svg:has(#dark:target) .page { fill: url(#night); }
    svg:has(#dark:target) .mark { fill: #DC8873; }
    svg:has(#tinted:target) .page { display: none; }
    svg:has(#tinted:target) .mark { fill: #F0F0F0; }
  </style>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF9F3"/>
      <stop offset="1" stop-color="#EFE7DA"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262320"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
  </defs>
  <g id="dark"/><g id="tinted"/>
  <rect class="page" width="1024" height="1024"/>
  <g class="mark" transform="translate(-15 -6)">
    <!-- the roof, thickening into its head at the left; the back, with a
         little stress; the base, running on past the back -->
    <path d="M 262 278 C 300 282, 380 298, 450 300 L 604 300 C 694 300, 744 344, 744 424 C 744 520, 738 610, 736 694 L 818 694 C 826 694, 830 700, 828 708 L 812 762 C 810 768, 804 772, 796 772 L 236 772 C 228 772, 224 766, 226 758 L 240 708 C 242 700, 248 694, 256 694 L 618 694 C 640 694, 652 682, 652 660 C 654 580, 660 500, 660 436 C 660 400, 644 382, 608 382 L 450 382 C 380 384, 300 392, 260 398 C 251 399, 245 394, 245 386 L 247 296 C 247 285, 252 278, 262 278 Z"/>
    <!-- the dagesh -->
    <circle cx="456" cy="540" r="44"/>
  </g>
</svg>
